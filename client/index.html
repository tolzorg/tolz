<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="oPtWEBJofWngCosyvlCZvi-IWDWzqPCzQJueGdYX1O8" />
    <!-- Page-specific tags (description, robots, og:title/description, twitter:title/description, canonical)
         are intentionally omitted here: every route renders its own <SEO> component, and React does not
         reliably de-duplicate those tags against static markup already in this file, so keeping both around
         left the static ones winning over the per-page values. og:image/type/site_name stay since they're
         the same on every page. -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.tolz.org/og-image.png" />
    <meta property="og:site_name" content="Tolz" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.tolz.org/og-image.png" />
    <meta name="theme-color" content="#ff5a5f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Tolz — Free Online Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
