# Dependabot: GitHub checks the website and server packages every week and
# opens a pull request when an update (especially a security fix) is
# available. Nothing is merged automatically — review, test, then merge.
# Also turn on "Dependabot alerts" and "Dependabot security updates" in
# GitHub → repo Settings → Code security.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Bundle routine minor/patch updates into one PR to keep the noise down.
      client-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      server-minor-and-patch:
        update-types: ["minor", "patch"]
