# Render deployment configuration for Tolz
#
# After first deploy, set these env vars manually in the Render dashboard:
#   tolz-api    → ALLOWED_ORIGINS=https://<tolz-client-url>.onrender.com
#   tolz-client → VITE_API_URL=https://<tolz-api-url>.onrender.com
#
# The frontend bakes VITE_API_URL at build time, so a redeploy is needed
# after setting it.

services:
  # ── Backend: Express API ───────────────────────────────────────────────────
  - type: web
    name: tolz-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false   # set to your frontend URL after deploy
      - key: APP_BASE_URL
        sync: false   # set to your backend URL, e.g. https://tolz.org (used by URL shortener)
      - key: REDIS_URL
        sync: false   # optional: Render Redis URL for persistent URL shortener links

  # ── Frontend: Vite SPA (static site) ──────────────────────────────────────
  - type: static
    name: tolz-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # set to your backend URL after deploy
    routes:
      # Rewrite all paths to index.html for client-side routing
      - type: rewrite
        source: /*
        destination: /index.html
    # NOTE: Render applies these headers only when this service is synced as a
    # Blueprint. If tolz-client was created by hand in the dashboard, add the
    # same headers under Render → tolz-client → Settings → Headers.
    headers:
      # Content Security Policy — update connect-src if using a custom API domain.
      # - script-src: 'wasm-unsafe-eval' for the ID Photo background-removal
      #   model; the sha256 hash allows ONLY the Google Tag Manager snippet in
      #   index.html (recompute it if that snippet ever changes, or analytics
      #   stops loading); googletagmanager.com for the GTM script itself.
      # - style-src 'unsafe-inline': the tools use React inline styles; without
      #   it every page loses its layout.
      # - connect-src: the API (*.onrender.com), live data for the Inflation
      #   (api.bls.gov) and Currency (open.er-api.com) calculators, the ID Photo
      #   model CDN (staticimgly.com) and Google Analytics (GA4 also reports to
      #   analytics.google.com, www.google.com and stats.g.doubleclick.net).
      # - img-src https:: GA4 loads an audience pixel from country-specific Google
      #   domains (google.com.pk, google.co.uk, …); images can't run code.
      # - worker-src covers the blob-URL worker the background-removal library uses.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-uYpqYb5Tdtm+Bo4n2s8qLewTYtao+Si/G57CSxBu7DM=' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.onrender.com https://api.bls.gov https://open.er-api.com https://staticimgly.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://*.google.com https://*.g.doubleclick.net https://www.googletagmanager.com; worker-src 'self' blob:; frame-src https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'"
      # Clickjacking protection (redundant with frame-ancestors above for
      # modern browsers, kept for older browser / defense-in-depth coverage)
      - path: /*
        name: X-Frame-Options
        value: DENY
      # Stop browsers from MIME-sniffing responses away from the declared type
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # Don't leak the full referring URL (path/query) to other origins
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Force HTTPS on repeat visits (Render already serves over HTTPS only)
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      # Disable browser features this site never uses
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()
      # Long-lived cache for hashed assets
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # No cache for HTML entry point
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
